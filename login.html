<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sabor e Braza</title>
    <link rel="stylesheet" href="CSS_BRAZZA/login.css">
</head>

<body>

    <header>
        <h1>Sabor e Braza</h1>

    <nav>
        <a href="brazza.html" style="display: inline-block; padding: 10px 18px; background-color: #7b2d16; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">INÍCIO</a>

    <main>
        <section class="inicio">
            <h2>Bem-vindo à Sabor e Braza!</h2>
            <p>Entre com seu usuário e sua senha para continuar.</p>
        </section>

        <!-- O login deve enviar os dados para login.php, não para braza.php. -->
        <form action="login.php" method="post">
            <section id="chapas">
                <section id="temperos">
                    <div class="produtos">
                        <div class="produto">
                            <input type="text" name="usuario" placeholder="USUÁRIO" required>

                            <!-- O nome precisa ser senha para corresponder ao login.php. -->
                            <input type="password" name="senha" placeholder="SENHA" required>

                            <button type="submit">ENTRAR</button>
                        </div>
                    </div>
                </section>
            </section>
        </form>

        <p>Não tem cadastro? <a href="cadastrar.html">Cadastre-se aqui</a>.</p>
        <br><br><br><br><br><br><br>
    </main>

    <footer>
        <h4>CONTATO:</h4><br>
        (55) 31 99999-9999<br>
        fogo.braza@gmail.com<br>
        ©fogo&brasa2026
    </footer>
